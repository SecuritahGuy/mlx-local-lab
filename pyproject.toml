[project]
name = "local-mlx-lab"
version = "0.1.0"
description = "Reproducible, localhost-only MLX model serving and benchmarking"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "mlx-lm>=0.31.3",
    "mlx-vlm>=0.6.15",
    "openai>=3.3.0",
    "pillow>=12.0.0",
    "psutil>=7.2.2",
    "pydantic>=2.13.4",
    "pyyaml>=6.0.2",
    "rich>=15.0.0",
    "typer>=0.27.1",
]

[project.scripts]
local-mlx = "local_mlx.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/local_mlx"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
